<!DOCTYPE html>
<html>

<head>

    <title>New Transaction</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
        }

        .header {
            background: #12355b;
            color: white;
            padding: 25px;
            text-align: center;
        }

        .container {
            width: 450px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 2px 10px #cccccc;
        }

        h2 {
            color: #12355b;
            text-align: center;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 12px;
            margin-top: 6px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 25px;
            background: #12355b;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #0d2945;
        }

        .result {
            margin-top: 25px;
            padding: 15px;
            text-align: center;
            border-radius: 6px;
            font-weight: bold;
        }

        .normal {
            background: #d4edda;
            color: green;
        }

        .suspicious {
            background: #f8d7da;
            color: red;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #12355b;
            text-decoration: none;
            font-weight: bold;
        }

    </style>

</head>


<body>

    <div class="header">

        <h1>AI-BASED SMART BANKING</h1>

        <p>NEW TRANSACTION</p>

    </div>


    <div class="container">

        <h2>TRANSACTION CHECK</h2>


        <form method="POST">

            <label>Customer ID</label>

            <input
                type="text"
                name="customer_id"
                placeholder="Enter Customer ID"
                required
            >


            <label>Transaction Amount</label>

            <input
                type="number"
                name="amount"
                placeholder="Enter Amount"
                min="1"
                required
            >


            <label>Transaction Type</label>

            <select name="transaction_type" required>

                <option value="">Select Type</option>

                <option value="UPI">UPI</option>

                <option value="Online">Online</option>

                <option value="Card">Card</option>

                <option value="International">
                    International
                </option>

            </select>


            <label>Location</label>

            <input
                type="text"
                name="location"
                placeholder="Enter Location"
                required
            >


            <button type="submit">
                CHECK TRANSACTION
            </button>

        </form>


        {% if result %}

            {% if result == "Normal Transaction" %}

                <div class="result normal">
                    ✓ Normal Transaction
                </div>

            {% else %}

                <div class="result suspicious">
                    ⚠ Suspicious Transaction Detected
                </div>

            {% endif %}

        {% endif %}


        <a href="/dashboard" class="back">
            BACK TO DASHBOARD
        </a>

    </div>

</body>

</html>
