<!DOCTYPE html>
<html>
<head>

    <title>AI Smart Banking - Login</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .login-box {
            background: white;
            width: 350px;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 4px 15px #cccccc;
            text-align: center;
        }

        h1 {
            color: #12355b;
            margin-bottom: 5px;
        }

        p {
            color: #666;
        }

        input {
            width: 90%;
            padding: 12px;
            margin: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            width: 97%;
            padding: 12px;
            margin-top: 15px;
            background: #12355b;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background: #0d2945;
        }

    </style>

</head>

<body>

    <div class="login-box">

        <h1>AI SMART BANKING</h1>

        <p>Transaction Monitoring System</p>

        <form method="POST">

            <input type="text"
                   name="username"
                   placeholder="Enter Username"
                   required>

            <input type="password"
                   name="password"
                   placeholder="Enter Password"
                   required>

            <button type="submit">LOGIN</button>

        </form>

    </div>

</body>
</html>
